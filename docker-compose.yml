version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: elevva-db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db_init:/docker-entrypoint-initdb.d
    networks:
      - elevva-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: . 
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - elevva-net

  web:
    image: node:20-alpine
    container_name: elevva-web
    working_dir: /app
    volumes:
      - ./frontend:/app
    # Simulacro: mantém container vivo até inicializarmos o Next.js
    command: tail -f /dev/null
    networks:
      - elevva-net
    depends_on:
      - api

networks:
  elevva-net:
    driver: bridge

volumes:
  postgres_data:
